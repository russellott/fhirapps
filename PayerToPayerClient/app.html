<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Exchange Tester</title>
  <script src="config.js"></script>
  <style>
    :root {
      --color-primary: #17b3b3;
      --color-primary-dark: #0e8282;
      --color-primary-light: #e6f9f9;
      --color-page-bg: #f0f5f9;
      --color-surface: #ffffff;
      --color-surface-alt: #f8fafc;
      --color-text-primary: #1a2a3a;
      --color-text-secondary: #6b7c8d;
      --color-border: #d1dce6;
      --color-error: #d32f2f;
      --color-error-bg: #fef2f2;
      --color-success: #2e7d32;
      --header-height: 56px;
      --sidebar-width: 220px;
      --sidebar-collapsed-width: 56px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-page-bg: #0f1923;
        --color-surface: #1a2535;
        --color-surface-alt: #1e2d40;
        --color-text-primary: #e8f0f8;
        --color-text-secondary: #8ba3bc;
        --color-border: #2a3a4d;
        --color-primary-light: #0d3a3a;
        --color-error-bg: #3a1515;
      }
    }
    :root[data-theme="dark"] {
      --color-page-bg: #0f1923;
      --color-surface: #1a2535;
      --color-surface-alt: #1e2d40;
      --color-text-primary: #e8f0f8;
      --color-text-secondary: #8ba3bc;
      --color-border: #2a3a4d;
      --color-primary-light: #0d3a3a;
      --color-error-bg: #3a1515;
    }
    :root[data-theme="light"] {
      --color-page-bg: #f0f5f9;
      --color-surface: #ffffff;
      --color-surface-alt: #f8fafc;
      --color-text-primary: #1a2a3a;
      --color-text-secondary: #6b7c8d;
      --color-border: #d1dce6;
      --color-primary-light: #e6f9f9;
      --color-error-bg: #fef2f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--color-page-bg);
      color: var(--color-text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #app-header {
      height: var(--header-height);
      flex-shrink: 0;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 10;
    }

    #app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #app-sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.15s ease;
    }
    #app-sidebar.collapsed { width: var(--sidebar-collapsed-width); }

    #app-main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: var(--color-page-bg);
    }

    /* Logo mark */
    .logo-mark {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .logo-mark div { background: var(--color-primary); border-radius: 1px; }
    .app-title { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .new-payer-chip {
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
      border: 1px solid var(--color-primary);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 8px;
      border-radius: 6px;
      color: var(--color-text-secondary);
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--color-surface-alt); color: var(--color-text-primary); }

    /* Sidebar */
    #app-sidebar { padding-top: 8px; }
    .sidebar-toggle { width: 100%; justify-content: flex-start; padding-left: 16px; margin-bottom: 8px; }
    nav { display: flex; flex-direction: column; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 16px;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-text-secondary);
      text-align: left;
      min-height: 40px;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-item:hover:not([aria-disabled="true"]) {
      background: var(--color-surface-alt);
      color: var(--color-text-primary);
    }
    .nav-item.active {
      border-left-color: var(--color-primary);
      color: var(--color-primary);
      background: var(--color-primary-light);
      font-weight: 500;
    }
    .nav-item[aria-disabled="true"] {
      opacity: 0.45;
      cursor: default;
    }
    .nav-label { overflow: hidden; }
    #app-sidebar.collapsed .nav-label { display: none; }
    #app-sidebar.collapsed .sidebar-toggle { justify-content: center; padding-left: 0; }
    .nav-icon { font-size: 16px; flex-shrink: 0; }

    /* View content */
    .view-container { max-width: 900px; }
    .view-header { margin-bottom: 24px; }
    .view-header h2 { font-size: 20px; font-weight: 600; }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--color-text-secondary);
    }
    .empty-state p { margin-bottom: 16px; font-size: 15px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      min-height: 40px;
    }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-primary:hover { background: var(--color-primary-dark); }
    .error {
      background: var(--color-error-bg);
      color: var(--color-error);
      border: 1px solid var(--color-error);
      border-radius: 6px;
      padding: 12px 16px;
    }

    /* Spinner for future use */
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* Payer cards */
    .payer-list { display: flex; flex-direction: column; gap: 8px; }
    .payer-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .payer-card-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }
    .payer-name { font-weight: 500; color: var(--color-text-primary); flex: 1; }
    .payer-member-count {
      font-size: 13px;
      color: var(--color-text-secondary);
      background: var(--color-surface-alt);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .payer-list-actions { margin-top: 16px; }

    /* Settings drawer */
    #settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
    }
    #settings-overlay.open { display: block; }
    #settings-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 360px;
      height: 100%;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.2s ease-out;
    }
    #settings-overlay.open #settings-drawer { transform: translateX(0); }
    .drawer-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--color-border); }
    .drawer-header h2 { font-size: 17px; font-weight: 600; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .drawer-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .settings-field { display: flex; flex-direction: column; gap: 4px; }
    .settings-label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
    .settings-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--color-surface);
      color: var(--color-text-primary);
      box-sizing: border-box;
    }
    .settings-input:focus { outline: 2px solid var(--color-primary); outline-offset: -1px; }
    .field-row { display: flex; gap: 8px; align-items: flex-end; }
    .field-row .settings-input { flex: 1; min-width: 0; }
    .secret-toggle {
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--color-text-secondary);
      white-space: nowrap;
      min-height: 38px;
      flex-shrink: 0;
    }
    .secret-toggle:hover { background: var(--color-surface-alt); }
    .btn-secondary { background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); }
    .btn-secondary:hover { background: var(--color-surface-alt); }
    .drawer-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-secondary); margin-bottom: 4px; }
    .export-feedback { font-size: 13px; color: var(--color-success); margin-top: 6px; }
    .import-error { font-size: 13px; color: var(--color-error); margin-top: 6px; }
    .import-summary { font-size: 13px; color: var(--color-text-primary); margin: 8px 0 4px; }
    .import-warning { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; }
    .import-confirm-actions { display: flex; gap: 8px; }

    /* Payer form (add/edit) */
    .payer-card-body { border-top: 1px solid var(--color-border); }
    .payer-form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
    .required-marker { color: var(--color-error); margin-left: 2px; }
    .form-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--color-surface);
      color: var(--color-text-primary);
      box-sizing: border-box;
    }
    .form-input:focus { outline: 2px solid var(--color-primary); outline-offset: -1px; }
    .form-input.invalid { border-color: var(--color-error); }
    .field-error { font-size: 12px; color: var(--color-error); display: none; margin-top: 2px; }
    .field-error.visible { display: block; }
    .form-row { display: flex; gap: 8px; align-items: flex-end; }
    .form-row .form-input { flex: 1; min-width: 0; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--color-border); margin-top: 4px; }
    .form-check-row { display: flex; align-items: center; gap: 8px; }
    .form-check-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--color-primary); cursor: pointer; }
    .form-check-row label { font-size: 14px; color: var(--color-text-primary); cursor: pointer; margin: 0; font-weight: normal; }
    .payer-card-header { cursor: pointer; }
    .payer-delete-btn { background: none; border: 1px solid var(--color-border); border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--color-text-secondary); white-space: nowrap; }
    .payer-delete-btn:hover { color: var(--color-error); border-color: var(--color-error); background: var(--color-surface-alt); }
    .tab-bar { display: flex; border-bottom: 1px solid var(--color-border); padding: 0 16px; gap: 0; }
    .tab-btn { background: none; border: none; padding: 10px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--color-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab-btn.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .tab-btn:hover:not(.active) { color: var(--color-text-primary); }
    .delete-confirm-row { display: flex; align-items: center; padding: 12px 16px; gap: 12px; flex-wrap: wrap; }
    .delete-confirm-text { flex: 1; font-size: 14px; color: var(--color-text-primary); }
    .delete-confirm-actions { display: flex; gap: 8px; }
    .btn-danger { background: var(--color-error); color: #fff; border: none; }
    .btn-danger:hover { opacity: 0.85; }
    .roster-stub { font-size: 14px; color: var(--color-text-secondary); padding: 16px 0; }
    .roster-container { padding: 12px 16px 16px; }
    .roster-actions-bar { margin-bottom: 10px; }
    .roster-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .roster-table th { text-align: left; padding: 6px 8px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-secondary); border-bottom: 1px solid var(--color-border); }
    .roster-table td { padding: 8px 8px; border-bottom: 1px solid var(--color-border); color: var(--color-text-primary); vertical-align: middle; }
    .roster-table tbody tr:last-child td { border-bottom: none; }
    .roster-empty-state { padding: 20px 16px; }
    .roster-empty-state p { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px; }
    .roster-actions { display: flex; gap: 6px; }
    .roster-action-btn { background: none; border: 1px solid var(--color-border); border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--color-text-secondary); white-space: nowrap; }
    .roster-action-btn:hover { color: var(--color-text-primary); background: var(--color-surface-alt); }
    button:disabled, .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .exchange-setup-panel { padding: 16px 0; }
    .exchange-form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .exchange-form-row label { font-weight: 500; font-size: 14px; }
    .exchange-select { width: 100%; max-width: 360px; }
    .exchange-summary { font-style: italic; color: var(--color-text-secondary); min-height: 1.4em; margin: 12px 0; }
    .step-tracker { display: flex; flex-direction: column; gap: 16px; padding: 16px 0; }
    .step-row { display: flex; align-items: center; gap: 12px; }
    .step-icon { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
    .step-pending { border: 2px dashed var(--color-border); }
    .step-in-progress { border: 2px solid var(--color-primary); animation: spin 1s linear infinite; }
    .step-success { background: var(--color-primary); color: #fff; }
    .step-success::after { content: '✓'; }
    .step-failed { background: #ef4444; color: #fff; }
    .step-failed::after { content: '✗'; }
    .step-content { flex: 1; }
    .step-name { font-weight: 500; font-size: 14px; }
    .step-detail { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  </style>
</head>
<body>
  <header id="app-header">
    <div class="logo-mark" aria-hidden="true">
      <div></div><div></div><div></div><div></div>
    </div>
    <h1 class="app-title">P2P Exchange Tester</h1>
    <span id="new-payer-chip" class="new-payer-chip" style="display:none"></span>
    <div style="flex:1"></div>
    <button id="settings-btn" class="icon-btn" aria-label="Open settings" title="Settings">&#9881;</button>
  </header>

  <div id="app-body">
    <aside id="app-sidebar">
      <button id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
      <nav aria-label="Main navigation">
        <button class="nav-item active" data-view="previous-payers">
          <span class="nav-icon" aria-hidden="true">&#127973;</span>
          <span class="nav-label">Previous Payers</span>
        </button>
        <button class="nav-item" data-view="exchange">
          <span class="nav-icon" aria-hidden="true">&#8644;</span>
          <span class="nav-label">Exchange</span>
        </button>
        <button class="nav-item" data-view="results" aria-disabled="true" tabindex="-1" title="Run an exchange to see results.">
          <span class="nav-icon" aria-hidden="true">&#128202;</span>
          <span class="nav-label">Results</span>
        </button>
      </nav>
    </aside>
    <main id="app-main"></main>
  </div>

  <script>
    // ConfigModule — config read/write and cold-start seeding
    const ConfigModule = {
      getConfig: function() {
        var raw = localStorage.getItem('p2pConfig');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch (e) { return null; }
      },

      saveConfig: function(config) {
        localStorage.setItem('p2pConfig', JSON.stringify(config));
      },

      seedFromDefaults: function() {
        var previousPayers = Object.entries(FHIR_SERVERS).map(function(entry) {
          return Object.assign({}, entry[1], {
            id: crypto.randomUUID(),
            roster: []
          });
        });
        var config = {
          newPayer: { name: '', clientId: '', clientSecret: '' },
          corsProxyUrl: '',
          previousPayers: previousPayers
        };
        ConfigModule.saveConfig(config);
        return config;
      },

      addPayer: function(payerObj) {
        var config = ConfigModule.getConfig() || { newPayer: { name: '', clientId: '', clientSecret: '' }, corsProxyUrl: '', previousPayers: [] };
        var newEntry = Object.assign({}, payerObj, {
          id: crypto.randomUUID(),
          roster: []
        });
        config.previousPayers.push(newEntry);
        ConfigModule.saveConfig(config);
        return newEntry.id;
      },

      updatePayer: function(id, fields) {
        var config = ConfigModule.getConfig();
        if (!config) return;
        var idx = config.previousPayers.findIndex(function(p) { return p.id === id; });
        if (idx === -1) return;
        Object.assign(config.previousPayers[idx], fields);
        ConfigModule.saveConfig(config);
      },

      deletePayer: function(id) {
        var config = ConfigModule.getConfig();
        if (!config) return;
        config.previousPayers = config.previousPayers.filter(function(p) { return p.id !== id; });
        ConfigModule.saveConfig(config);
      }
    };

    // ExchangeModule — Story 3.2
    const ExchangeModule = {
      hasResult() { return false; },

      _setStepState: function(stepNum, state, detailText) {
        var row = document.getElementById('step-row-' + stepNum);
        if (!row) return;
        var icon = row.querySelector('.step-icon');
        if (icon) { icon.className = 'step-icon step-' + state; }
        if (detailText !== undefined) {
          var detail = document.getElementById('step-detail-' + stepNum);
          if (detail) { detail.textContent = detailText; }
        }
      },

      _showTryAgain: function() {
        var postPanel = document.getElementById('exchange-post-panel');
        if (postPanel) {
          postPanel.innerHTML = '<button id="exchange-try-again-btn" class="btn btn-secondary" type="button">Try Again</button>';
          var tryAgainBtn = document.getElementById('exchange-try-again-btn');
          if (tryAgainBtn) {
            tryAgainBtn.addEventListener('click', function() {
              UIModule._exchangePhase = 'setup';
              UIModule.showView('exchange');
            });
          }
        }
      },

      _acquireSystemToken: async function(payer, newPayerConfig) {
        try {
          var tokenUrl = payer.tokenUrl;
          if (payer.useProxy && newPayerConfig.corsProxyUrl) {
            tokenUrl = newPayerConfig.corsProxyUrl + '?url=' + encodeURIComponent(tokenUrl);
          }
          var body = new URLSearchParams();
          body.set('grant_type', 'client_credentials');
          body.set('scope', 'system/*.rs');
          var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
          if (payer.tokenAuthMethod === 'client_secret_basic') {
            headers['Authorization'] = 'Basic ' + btoa(payer.clientId + ':' + payer.clientSecret);
          } else {
            body.set('client_id', payer.clientId);
            body.set('client_secret', payer.clientSecret);
          }
          var response = await fetch(tokenUrl, {
            method: 'POST',
            headers: headers,
            body: body,
            referrerPolicy: 'no-referrer'
          });
          if (!response.ok) {
            return { ok: false, data: null, error: 'Token request failed: HTTP ' + response.status };
          }
          var tokenData = await response.json();
          if (!tokenData.access_token) {
            return { ok: false, data: null, error: 'Token response missing access_token' };
          }
          return { ok: true, data: tokenData, error: null };
        } catch (err) {
          return { ok: false, data: null, error: 'Token request error: ' + (err.message || String(err)) };
        }
      },

      _runMemberMatch: async function(payer, member, systemToken, newPayerConfig) {
        try {
          var matchUrl = payer.fhirBaseUrl + '/Patient/$member-match';
          if (payer.useProxy && newPayerConfig.corsProxyUrl) {
            matchUrl = newPayerConfig.corsProxyUrl + '?url=' + encodeURIComponent(matchUrl);
          }
          var now = new Date().toISOString();
          var fiveYearsAgo = new Date(Date.now() - 5 * 365.25 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
          var parametersBody = {
            resourceType: 'Parameters',
            parameter: [
              {
                name: 'MemberPatient',
                resource: {
                  resourceType: 'Patient',
                  name: [{ family: member.lastName, given: [member.firstName] }],
                  birthDate: member.dateOfBirth,
                  gender: member.gender
                }
              },
              {
                name: 'CoverageToMatch',
                resource: {
                  resourceType: 'Coverage',
                  status: 'active',
                  subscriberId: member.memberIdAtOldPayer,
                  beneficiary: { display: member.firstName + ' ' + member.lastName },
                  payor: [{ display: payer.name }]
                }
              },
              {
                name: 'CoverageToLink',
                resource: {
                  resourceType: 'Coverage',
                  status: 'active',
                  beneficiary: { display: member.firstName + ' ' + member.lastName },
                  payor: [{ display: newPayerConfig.newPayer ? newPayerConfig.newPayer.name : '' }]
                }
              },
              {
                name: 'Consent',
                resource: {
                  resourceType: 'Consent',
                  status: 'active',
                  scope: { coding: [{ system: 'http://terminology.hl7.org/CodeSystem/consentscope', code: 'patient-privacy' }] },
                  category: [{ coding: [{ system: 'http://loinc.org', code: '59284-0' }] }],
                  dateTime: now,
                  performer: [{ display: newPayerConfig.newPayer ? newPayerConfig.newPayer.name : '' }],
                  organization: [{ display: payer.name }],
                  provision: {
                    type: 'permit',
                    period: { start: fiveYearsAgo, end: now.slice(0, 10) },
                    purpose: [{ system: 'http://terminology.hl7.org/CodeSystem/v3-ActReason', code: 'TREAT' }]
                  }
                }
              }
            ]
          };
          var response = await fetch(matchUrl, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + systemToken, 'Content-Type': 'application/fhir+json' },
            body: JSON.stringify(parametersBody),
            referrerPolicy: 'no-referrer'
          });
          if (response.status === 422) {
            var oo = await response.json();
            var issues = (oo.issue || []);
            var code = issues.length > 0 ? (issues[0].code || '') : '';
            if (code === 'consent') {
              return { ok: false, data: null, error: 'Consent denied by Previous Payer. Verify Consent resource construction.' };
            }
            return { ok: false, data: null, error: 'Member not found at Previous Payer — check demographics or member ID. Submitted: ' + member.firstName + ' ' + member.lastName + ', DOB ' + member.dateOfBirth + ', Member ID ' + member.memberIdAtOldPayer + '.' };
          }
          if (!response.ok) {
            return { ok: false, data: null, error: 'Member match failed: HTTP ' + response.status };
          }
          var responseData = await response.json();
          var params = (responseData.parameter || []);
          var memberPatient = params.find(function(p) { return p.name === 'MemberPatient'; });
          var fhirId = memberPatient && memberPatient.resource && memberPatient.resource.id;
          if (!fhirId) {
            return { ok: false, data: null, error: 'Member match response missing patient ID' };
          }
          return { ok: true, data: { fhirId: fhirId }, error: null };
        } catch (err) {
          return { ok: false, data: null, error: 'Member match error: ' + (err.message || String(err)) };
        }
      },

      runExchange: async function(payer, member, newPayerConfig) {
        ExchangeModule._setStepState(1, 'in-progress', '');
        var step1 = await ExchangeModule._acquireSystemToken(payer, newPayerConfig);
        if (!step1.ok) {
          ExchangeModule._setStepState(1, 'failed', step1.error);
          ExchangeModule._showTryAgain();
          return;
        }
        var expiresIn = step1.data.expires_in;
        var successText = (typeof expiresIn === 'number' || (typeof expiresIn === 'string' && !isNaN(Number(expiresIn))))
          ? 'Access token acquired — expires in ' + Number(expiresIn) + 's'
          : 'Access token acquired';
        ExchangeModule._setStepState(1, 'success', successText);
        var systemToken = step1.data.access_token;
        ExchangeModule._setStepState(2, 'in-progress', '');
        var step2 = await ExchangeModule._runMemberMatch(payer, member, systemToken, newPayerConfig);
        if (!step2.ok) {
          ExchangeModule._setStepState(2, 'failed', step2.error);
          ExchangeModule._showTryAgain();
          return;
        }
        ExchangeModule._setStepState(2, 'success', 'Member matched — FHIR ID: ' + step2.data.fhirId);
        var fhirId = step2.data.fhirId;
        // Steps 3–4: pending — Story 3.4–3.5
      }
    };

            UIModule._expandedPayerTab = 'config';

          });
        });

        // Wire new payer form (Story 1.4)
        if (UIModule._expandedPayerId === 'new') {
          var cancelBtn = document.getElementById('new-payer-cancel');

              UIModule._expandedPayerId = null;

                inp.type = 'text';
                toggleBtn.textContent = 'Hide';
                toggleBtn.setAttribute('aria-label', 'Hide client secret');
              } else {
                inp.type = 'password';
                toggleBtn.textContent = 'Show';
                toggleBtn.setAttribute('aria-label', 'Show client secret');
              }
            });
          }

          var saveBtn = document.getElementById('new-payer-save');
          if (saveBtn) {
            saveBtn.addEventListener('click', function() {
              var fields = [
                { inputId: 'np-name',      errorId: 'np-name-error',      key: 'name' },
                { inputId: 'np-fhir-url',  errorId: 'np-fhir-url-error',  key: 'fhirBaseUrl' },
                { inputId: 'np-token-url', errorId: 'np-token-url-error', key: 'tokenUrl' },
                { inputId: 'np-client-id', errorId: 'np-client-id-error', key: 'clientId' },
                { inputId: 'np-secret',    errorId: 'np-secret-error',    key: 'clientSecret' }
              ];

              // Clear previous errors
              fields.forEach(function(f) {
                var inp = document.getElementById(f.inputId);
                var err = document.getElementById(f.errorId);
                inp.classList.remove('invalid');
                err.classList.remove('visible');
              });

              // Validate
              var valid = true;
              var values = {};
              fields.forEach(function(f) {
                var inp = document.getElementById(f.inputId);
                var err = document.getElementById(f.errorId);
                var val = inp.value.trim();
                values[f.key] = val;
                if (!val) {
                  inp.classList.add('invalid');
                  err.textContent = 'Required';
                  err.classList.add('visible');
                  valid = false;
                }
              });

              if (!valid) return;

              values.tokenAuthMethod = document.getElementById('np-auth-method').value;
              values.useProxy = document.getElementById('np-use-proxy').checked;

              ConfigModule.addPayer(values);
              UIModule._expandedPayerId = null;
              UIModule.showView('previous-payers');
            });

        }

        // Wire edit form (when an existing payer is expanded, Config tab active)
        if (UIModule._expandedPayerId && UIModule._expandedPayerId !== 'new' && UIModule._expandedPayerTab === 'config') {
          var epToggleBtn = document.getElementById('ep-secret-toggle');
          if (epToggleBtn) {
            epToggleBtn.addEventListener('click', function() {
              var inp = document.getElementById('ep-secret');
              if (inp.type === 'password') {
                inp.type = 'text';
                epToggleBtn.textContent = 'Hide';
                epToggleBtn.setAttribute('aria-label', 'Hide client secret');
              } else {
                inp.type = 'password';
                epToggleBtn.textContent = 'Show';
                epToggleBtn.setAttribute('aria-label', 'Show client secret');
              }
            });
          }

          var epCancelBtn = document.getElementById('ep-cancel');
          if (epCancelBtn) {
            epCancelBtn.addEventListener('click', function() {
              UIModule._expandedPayerId = null;
              UIModule.showView('previous-payers');
            });
          }

          var epSaveBtn = document.getElementById('ep-save');
          if (epSaveBtn) {
            epSaveBtn.addEventListener('click', function() {
              var epFields = [
                { inputId: 'ep-name',      errorId: 'ep-name-error',      key: 'name' },
                { inputId: 'ep-fhir-url',  errorId: 'ep-fhir-url-error',  key: 'fhirBaseUrl' },
                { inputId: 'ep-token-url', errorId: 'ep-token-url-error', key: 'tokenUrl' },
                { inputId: 'ep-client-id', errorId: 'ep-client-id-error', key: 'clientId' },
                { inputId: 'ep-secret',    errorId: 'ep-secret-error',    key: 'clientSecret' }
              ];

              // Clear previous errors
              epFields.forEach(function(f) {
                var inp = document.getElementById(f.inputId);
                var err = document.getElementById(f.errorId);
                inp.classList.remove('invalid');
                err.classList.remove('visible');
              });

              // Validate
              var valid = true;
              var values = {};
              epFields.forEach(function(f) {
                var inp = document.getElementById(f.inputId);
                var err = document.getElementById(f.errorId);
                var val = inp.value.trim();
                values[f.key] = val;
                if (!val) {
                  inp.classList.add('invalid');
                  err.textContent = 'Required';
                  err.classList.add('visible');
                  valid = false;
                }
              });

              if (!valid) return;

              values.tokenAuthMethod = document.getElementById('ep-auth-method').value;
              values.useProxy = document.getElementById('ep-use-proxy').checked;

              ConfigModule.updatePayer(UIModule._expandedPayerId, values);
              UIModule._expandedPayerId = null;
              UIModule.showView('previous-payers');
            });
          }
        }

        // Wire roster tab add-member form (Story 2.2)
        if (UIModule._expandedPayerId && UIModule._expandedPayerId !== 'new' && UIModule._expandedPayerTab === 'roster') {
          var rosterAddBtn = document.getElementById('roster-add-btn');
          if (rosterAddBtn) {
            rosterAddBtn.addEventListener('click', function() {
              UIModule._rosterEditingMemberId = null;
              UIModule._rosterDeleteConfirmMemberId = null;
              UIModule._rosterAddingMember = true;
              UIModule.showView('previous-payers');
            });
          }

          if (UIModule._rosterAddingMember) {
            var maPayerId = UIModule._expandedPayerId;

            function updateMaButtonState() {
              var maFn = document.getElementById('ma-first-name');
              var maLn = document.getElementById('ma-last-name');
              var maDob = document.getElementById('ma-dob');
              var maGen = document.getElementById('ma-gender');
              var maMid = document.getElementById('ma-member-id');
              var maSave = document.getElementById('member-add-save');
              if (!maFn || !maSave) return;
              maSave.disabled = !(maFn.value.trim() && maLn.value.trim() && maDob.value && maGen.value && maMid.value.trim());
            }

            ['ma-first-name', 'ma-last-name', 'ma-dob', 'ma-gender', 'ma-member-id'].forEach(function(fieldId) {
              var el = document.getElementById(fieldId);
              if (el) {
                el.addEventListener('input', updateMaButtonState);
                el.addEventListener('change', updateMaButtonState);
              }
            });

            var maCancelBtn = document.getElementById('member-add-cancel');
            if (maCancelBtn) {
              maCancelBtn.addEventListener('click', function() {
                UIModule._rosterAddingMember = false;
                UIModule.showView('previous-payers');
              });
            }

            var maSaveBtn = document.getElementById('member-add-save');
            if (maSaveBtn) {
              maSaveBtn.addEventListener('click', function() {
                var fn = document.getElementById('ma-first-name').value.trim();
                var ln = document.getElementById('ma-last-name').value.trim();
                var dob = document.getElementById('ma-dob').value;
                var gen = document.getElementById('ma-gender').value;
                var mid = document.getElementById('ma-member-id').value.trim();
                if (!fn || !ln || !dob || !gen || !mid) return;
                var config = ConfigModule.getConfig();
                var payer = config.previousPayers.find(function(p) { return p.id === maPayerId; });
                if (!payer) return;
                var roster = Array.isArray(payer.roster) ? payer.roster.slice() : [];
                roster.push({ id: crypto.randomUUID(), firstName: fn, lastName: ln, dateOfBirth: dob, gender: gen, memberIdAtOldPayer: mid });
                ConfigModule.updatePayer(maPayerId, { roster: roster });
                UIModule._rosterAddingMember = false;
                UIModule.showView('previous-payers');
              });
            }
          }

          // Wire edit action buttons (Story 2.3)
          document.querySelectorAll('.roster-action-btn[data-action="edit"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
              UIModule._rosterAddingMember = false;
              UIModule._rosterDeleteConfirmMemberId = null;
              UIModule._rosterEditingMemberId = btn.dataset.memberId;
              UIModule.showView('previous-payers');
            });

          document.querySelectorAll('.roster-action-btn[data-action="delete"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
              UIModule._rosterAddingMember = false;
              UIModule._rosterEditingMemberId = null;
              UIModule._rosterDeleteConfirmMemberId = btn.dataset.memberId;
              UIModule.showView('previous-payers');
              var focusTarget = document.getElementById('member-delete-confirm');
              if (focusTarget) focusTarget.focus();
            });
          });

          // Wire edit form save/cancel (Story 2.3)
          if (UIModule._rosterEditingMemberId) {
            var meEditPayerId = UIModule._expandedPayerId;
            var meEditMemberId = UIModule._rosterEditingMemberId;

            var meMemberCancelBtn = document.getElementById('me-cancel');
            if (meMemberCancelBtn) {
              meMemberCancelBtn.addEventListener('click', function() {
                UIModule._rosterEditingMemberId = null;
                UIModule.showView('previous-payers');
              });
            }

            var meMemberSaveBtn = document.getElementById('me-save');
            if (meMemberSaveBtn) {
              meMemberSaveBtn.addEventListener('click', function() {
                var meFieldIds = ['me-first-name', 'me-last-name', 'me-dob', 'me-gender', 'me-member-id'];
                meFieldIds.forEach(function(id) { var el = document.getElementById(id); if (el) el.classList.remove('invalid'); });
                var meValid = true;
                var meValues = {};
                meFieldIds.forEach(function(id) {
                  var el = document.getElementById(id);
                  if (!el) return;
                  var val = el.tagName === 'SELECT' ? el.value : el.value.trim();
                  meValues[id] = val;
                  if (!val) { el.classList.add('invalid'); meValid = false; }
                });
                if (!meValid) return;
                var config = ConfigModule.getConfig();
                var payer = config.previousPayers.find(function(p) { return p.id === meEditPayerId; });
                if (!payer) return;
                var updatedRoster = Array.isArray(payer.roster) ? payer.roster.map(function(m) {
                  return m.id === meEditMemberId
                    ? { id: m.id, firstName: meValues['me-first-name'], lastName: meValues['me-last-name'], dateOfBirth: meValues['me-dob'], gender: meValues['me-gender'], memberIdAtOldPayer: meValues['me-member-id'] }
                    : m;
                }) : [];
                ConfigModule.updatePayer(meEditPayerId, { roster: updatedRoster });
                UIModule._rosterEditingMemberId = null;
                UIModule.showView('previous-payers');
              });
            }
          }

          // Wire delete confirm/cancel (Story 2.3)
          if (UIModule._rosterDeleteConfirmMemberId) {
            var meDeletePayerId = UIModule._expandedPayerId;
            var meDeleteMemberId = UIModule._rosterDeleteConfirmMemberId;

            var memberDeleteConfirmBtn = document.getElementById('member-delete-confirm');
            if (memberDeleteConfirmBtn) {
              memberDeleteConfirmBtn.addEventListener('click', function() {
                var config = ConfigModule.getConfig();
                var payer = config.previousPayers.find(function(p) { return p.id === meDeletePayerId; });
                if (!payer) return;
                var filteredRoster = Array.isArray(payer.roster) ? payer.roster.filter(function(m) { return m.id !== meDeleteMemberId; }) : [];
                ConfigModule.updatePayer(meDeletePayerId, { roster: filteredRoster });
                UIModule._rosterDeleteConfirmMemberId = null;
                UIModule.showView('previous-payers');
              });
            }

            var memberDeleteCancelBtn = document.getElementById('member-delete-cancel');
            if (memberDeleteCancelBtn) {
              memberDeleteCancelBtn.addEventListener('click', function() {
                UIModule._rosterDeleteConfirmMemberId = null;
                UIModule.showView('previous-payers');
              });
            }
          }
        }
      },

            UIModule._exchangeSelectedMemberId = this.value || null;
            UIModule.showView('exchange');
          });
        }

        var runBtn = document.getElementById('exchange-run-btn');
        if (runBtn) {
          runBtn.addEventListener('click', function() {
            var config = ConfigModule.getConfig();
            if (!config || !Array.isArray(config.previousPayers)) return;
            var payer = config.previousPayers.find(function(p) { return p.id === UIModule._exchangeSelectedPayerId; });
            var member = payer && Array.isArray(payer.roster) ? payer.roster.find(function(m) { return m.id === UIModule._exchangeSelectedMemberId; }) : null;
            if (!payer || !member) return;
            UIModule._exchangePhase = 'running';
            UIModule.showView('exchange');
            ExchangeModule.runExchange(payer, member, { newPayer: config.newPayer, corsProxyUrl: config.corsProxyUrl });
          });
        }

        html += '<div>';

        html += '<div id="import-error" class="import-error" style="display:none"></div>';
        html += '<div id="import-confirm-area" style="display:none">';

        // Import — file selected
        document.getElementById('settings-import-file').addEventListener('change', function(e) {
          var file = e.target.files[0];

            confirmArea.style.display = 'none';
            var parsed;
            try {
              parsed = JSON.parse(evt.target.result);
            } catch (err) {
              errorEl.textContent = 'Invalid JSON file. Please check the format.';
              errorEl.style.display = '';
              return;
            }
            if (!parsed || !Array.isArray(parsed.previousPayers)) {
              errorEl.textContent = 'Invalid config file. Expected a previousPayers array.';
              errorEl.style.display = '';
              return;
            }
            var payerCount = parsed.previousPayers.length;
            var memberCount = parsed.previousPayers.reduce(function(sum, p) {
              return sum + (Array.isArray(p.roster) ? p.roster.length : 0);
            }, 0);
            var payerLabel = payerCount === 1 ? '1 Previous Payer' : payerCount + ' Previous Payers';
            var memberLabel = memberCount === 1 ? '1 total member' : memberCount + ' total members';
            summaryEl.textContent = 'This file contains ' + payerLabel + ' with ' + memberLabel + '.';
            UIModule._importPendingConfig = parsed;
            confirmArea.style.display = '';
          };
          reader.readAsText(file);
        });

        // Import — Replace
        document.getElementById('import-replace-btn').addEventListener('click', function() {
          if (!UIModule._importPendingConfig) return;
          ConfigModule.saveConfig(UIModule._importPendingConfig);
          UIModule._importPendingConfig = null;
          UIModule.closeSettings();
          UIModule.showView('previous-payers');
          UIModule.updateNewPayerChip();
        });

        // Import — Cancel
        document.getElementById('import-cancel-btn').addEventListener('click', function() {
          UIModule._importPendingConfig = null;
          var confirmArea = document.getElementById('import-confirm-area');
          if (confirmArea) { confirmArea.style.display = 'none'; }
          var fileInput = document.getElementById('settings-import-file');
          if (fileInput) { fileInput.value = ''; }
        });

        UIModule._backdropClickHandler = function(e) {
          if (e.target === overlay) {
            UIModule.closeSettings();
          }
        };
        overlay.addEventListener('click', UIModule._backdropClickHandler);

        UIModule._settingsKeyHandler = function(e) {
          if (e.key === 'Escape') {
            UIModule.closeSettings();
            return;
          }
          if (e.key === 'Tab') {
            var drawer = document.getElementById('settings-drawer');
            if (!drawer) return;
            var focusable = drawer.querySelectorAll('button, input');
            var first = focusable[0];
            var last = focusable[focusable.length - 1];
            if (e.shiftKey) {
              if (document.activeElement === first) {
                e.preventDefault();
                last.focus();
              }
            } else {
              if (document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
          }
        };
        document.addEventListener('keydown', UIModule._settingsKeyHandler);

        document.getElementById('settings-name').focus();
      },

      closeSettings: function() {
        UIModule._importPendingConfig = null;
        var overlay = document.getElementById('settings-overlay');
        overlay.classList.remove('open');
        if (UIModule._settingsKeyHandler) {
          document.removeEventListener('keydown', UIModule._settingsKeyHandler);
          UIModule._settingsKeyHandler = null;
        }
        if (UIModule._backdropClickHandler) {
          overlay.removeEventListener('click', UIModule._backdropClickHandler);
          UIModule._backdropClickHandler = null;
        }
        setTimeout(function() {
          // Guard: don't wipe content if drawer was reopened before timeout fires
          if (overlay && !overlay.classList.contains('open')) { overlay.innerHTML = ''; }
        }, 200);
        var gearBtn = document.getElementById('settings-btn');
        if (gearBtn) { gearBtn.focus(); }
      },

      updateNewPayerChip: function() {
        var config = ConfigModule.getConfig();
        var chip = document.getElementById('new-payer-chip');
        var name = config && config.newPayer && config.newPayer.name;
        if (name) {
          chip.textContent = name;
          chip.style.display = '';
        } else {
          chip.style.display = 'none';
        }
      },

      bindEvents: function() {
        document.querySelectorAll('.nav-item').forEach(function(btn) {
          btn.addEventListener('click', function() {
            if (btn.getAttribute('aria-disabled') === 'true') return;
            UIModule.showView(btn.dataset.view);
          });
        });

        document.getElementById('sidebar-toggle').addEventListener('click', function() {
          var sidebar = document.getElementById('app-sidebar');
          var nowCollapsed = sidebar.classList.toggle('collapsed');
          if (nowCollapsed) {
            localStorage.setItem('p2pSidebarCollapsed', 'true');
          } else {
            localStorage.removeItem('p2pSidebarCollapsed');
          }
        });

        document.getElementById('settings-btn').addEventListener('click', function() {
          UIModule.showSettings();
        });
      },

      init: function() {
        if (localStorage.getItem('p2pSidebarCollapsed') === 'true') {
          document.getElementById('app-sidebar').classList.add('collapsed');
        }
        if (!ConfigModule.getConfig()) {
          ConfigModule.seedFromDefaults();
        }
        this.bindEvents();
        this.updateNewPayerChip();
        this.showView('previous-payers');
      }
    };

    function init() {
      UIModule.init();
    }

    init();
  </script>
  <div id="settings-overlay"></div>
</body>
</html>
